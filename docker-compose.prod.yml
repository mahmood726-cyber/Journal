version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: journal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-journal_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-journal_pass}
      POSTGRES_DB: ${DB_NAME:-journal_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - journal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-journal_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery & Caching
  redis:
    image: redis:7-alpine
    container_name: journal_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - journal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: journal_backend
    restart: unless-stopped
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    volumes:
      - ./uploads:/app/uploads
      - ./static:/app/static
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-journal_user}:${DB_PASSWORD:-journal_pass}@db:5432/${DB_NAME:-journal_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - journal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: journal_celery
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info --concurrency=2
    volumes:
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-journal_user}:${DB_PASSWORD:-journal_pass}@db:5432/${DB_NAME:-journal_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - journal_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: journal_celery_beat
    restart: unless-stopped
    command: celery -A tasks beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-journal_user}:${DB_PASSWORD:-journal_pass}@db:5432/${DB_NAME:-journal_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - journal_network

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${API_URL}
    container_name: journal_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - journal_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: journal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/var/www/uploads:ro
      - ./static:/var/www/static:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - journal_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL
  certbot:
    image: certbot/certbot:latest
    container_name: journal_certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - journal_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_data:
    driver: local
  certbot_conf:
    driver: local

networks:
  journal_network:
    driver: bridge
